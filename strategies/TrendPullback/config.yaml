# TrendPullback — Follow trend direction, enter on pullbacks
# Research: EMA crossover trend + pullback entries = highest risk-adjusted
# returns in crypto across multiple backtesting studies

detector:
  type: trend_strength
  timeframe: 1D
  params:
    fast_period: 13
    slow_period: 34
    separation_pct: 0.3      # low threshold — capture mild trends too
    confirm_bars: 2

regimes:
  trending-up:
    behavior: trend_follow   # long bias — buy pullbacks to EMA
  trending-down:
    behavior: trend_follow   # short bias — sell rallies to EMA
  ranging: null              # flat in no-trend — avoid chop
  cold-start: null

params:
  risk_pct: 0.05
  sl_pct: 0.035
  tp_pct: 0.0               # no fixed TP — let winners run via trailing
  trail_pct: 0.03
  trend_ma_period: 34        # use the slow EMA as the MA reference
  trend_ma_type: ema

transitions:
  on_switch: close_all
  cooldown_bars: 8

data_routes: [1D, 4h]
