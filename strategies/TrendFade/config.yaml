# TrendFade — ride confirmed trends, fade ranges
#
# Thesis: "Ride confirmed trends, fade ranges"
# Detector: SuperTrend V7 (3-regime: bullish/bearish/ranging)
# Bullish: trend_pullback — buy dips in confirmed uptrends
# Bearish: null — capital preservation, don't fight downtrends
# Ranging: bb_mean_reversion — fade BB extremes in sideways markets
#
# Asset: BTC-USDT 4h on Bybit USDT Perpetual
# Balance: 10000

detector:
  type: supertrend_v7
  params:
    st_period: 10
    st_factor: 3.0
    adx_period: 14
    chop_period: 14
    trend_sma_period: 100
    timeframe: '1D'
    alpha: 0.3
    alpha_boost: 0.6
    strong_entry: 0.70
    strong_exit: 0.55
    weak_entry: 0.40
    weak_exit: 0.35
    circuit_breaker_atr: 1.5

regimes:
  bullish: trend_pullback
  bearish: null
  ranging: bb_mean_reversion
  cold-start: null

transitions:
  on_switch: close_all
  cooldown_bars: 8

params:
  # Pullback timeframe — must match data_routes
  pb_timeframe: '4h'

  # Trend pullback entry (operates on 4h candles)
  pb_fast_ema:
    default: 13
    min: 8
    max: 21
  pb_slow_ema:
    default: 34
    min: 20
    max: 55
  pb_rsi_period:
    default: 14
    min: 7
    max: 21
  pb_rsi_max:
    default: 55
    min: 40
    max: 70
  pb_atr_period:
    default: 14
    min: 7
    max: 21
  pb_atr_sl_mult:
    default: 2.0
    min: 1.0
    max: 4.0
  pb_min_ema_spread:
    default: 0.3
    min: 0.1
    max: 1.0

  # BB mean-reversion (operates on route timeframe)
  bb_window:
    default: 20
    min: 10
    max: 30
  bb_mult:
    default: 2.5
    min: 1.5
    max: 3.5
  bb_sl_pct:
    default: 0.02
    min: 0.005
    max: 0.04
  bb_min_width_pct:
    default: 4.0
    min: 1.0
    max: 8.0
  rsi_period:
    default: 14
    min: 7
    max: 21
  rsi_oversold:
    default: 25
    min: 15
    max: 40
  rsi_overbought:
    default: 75
    min: 60
    max: 85

  # Shared risk / position sizing
  risk_pct:
    default: 0.05
    min: 0.01
    max: 0.15
  trail_pct:
    default: 0.03
    min: 0.01
    max: 0.08
